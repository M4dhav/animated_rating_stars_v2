name: animated_rating_stars_v2
description: A highly customizable Flutter rating bar widget for interactive star-based ratings.
version: 1.0.0
homepage: https://github.com/M4dhav/animated_rating_stars_v2
screenshots:
  - description: 'Examples usage of rating bars.'
    path: screenshot1.png

environment:
  sdk: '>=3.1.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# This package is a pure Dart/Flutter widget package. It contains no platform
# channels or native code, so it deliberately declares no `plugin:` section and
# ships no android/, ios/, linux/, macos/, windows/ or web/ directories.
flutter:
  uses-material-design: true
